name: python

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xbot_service_interface_py
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: xbot_service_interface_py
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Set release version
        if: inputs.release-version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          path = Path("pyproject.toml")
          source = path.read_text()
          source, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{os.environ["RELEASE_VERSION"]}"',
              source,
          )
          if count != 1 or tomllib.loads(source)["project"]["version"] != os.environ["RELEASE_VERSION"]:
              raise SystemExit("Could not set the Python release version")
          path.write_text(source)
          PY
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: xbot_service_interface_py/dist/
          if-no-files-found: error
